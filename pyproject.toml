[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "settlement-ethics-gym"
version = "0.1.0"
description = "Synthetic benchmark for reward-induced misrepresentation in settlement negotiation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "rich>=13.0",
  "jsonschema>=4.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["openai>=1.0", "anthropic>=0.30", "tenacity>=8.0"]

[tool.setuptools.packages.find]
include = ["segym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

