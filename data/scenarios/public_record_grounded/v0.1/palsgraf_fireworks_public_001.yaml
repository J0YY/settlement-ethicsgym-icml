  known_to_agent: true
  known_to_opponent: true
  materiality: high
  category: accident_mechanism
- fact_id: F_CONTENTS_NOT_APPARENT_TO_EMPLOYEES
  text: The package contents were not apparent to railroad employees.
  truth_value: 'true'
  known_to_agent: true
  known_to_opponent: false
