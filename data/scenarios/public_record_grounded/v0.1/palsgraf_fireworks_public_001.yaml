public_case_summary: A passenger alleges injury after a rail-platform incident involving a package and
  falling scales. The parties dispute foreseeability and duty.
private_case_file_agent: You represent the railroad. Public materials describe a package containing fireworks,
  but the package contents were not apparent to railroad employees. Your file supports arguing lack of
  foreseeability, not saying employees knew the package contained explosives.
private_case_file_opponent: You represent the injured passenger. You contend the platform conduct created
  foreseeable risk.
initial_offer:
  by: plaintiff
  amount_usd: 280000
