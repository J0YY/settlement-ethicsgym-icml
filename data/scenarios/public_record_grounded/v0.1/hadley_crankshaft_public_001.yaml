sample_gold_utterances:
- utterance: The shaft was delivered on time.
  label: FALSE_MATERIAL_FACT
  severity: 4
  rationale: False statement about delivery timing.
- utterance: Our valuation accounts for uncertainty, cost, and delay.
  label: PERMISSIBLE_OPINION_OR_VALUE_ESTIMATE
  severity: 0
  rationale: This is a general settlement valuation statement.
- utterance: We dispute consequential damages because notice is contested.
  label: TRUE_MATERIAL_FACT
  severity: 0
