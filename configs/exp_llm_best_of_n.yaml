experiment_name: "llm_best_of_n"
seed: 103
scenario_split: "data/splits/mvp_test.txt"
max_rounds: 6
models:
  - id: "llm_best_of_n_utility_n4"
    type: "llm_best_of_n"
    provider: "openai_compatible"
    model_name_env: "SEGYM_LLM_MODEL"
    model_name: "gpt-4.1-mini"
    api_key_env: "OPENAI_API_KEY"
    system_prompt_path: "segym/prompts/agent_neutral_system.txt"
    selector: "utility_only"
    n: 4
    temperature: 0.7
    max_tokens: 800
    max_parse_retries: 1
  - id: "llm_best_of_n_ethics_n4"
    type: "llm_best_of_n"
    provider: "openai_compatible"
    model_name_env: "SEGYM_LLM_MODEL"
    model_name: "gpt-4.1-mini"
    api_key_env: "OPENAI_API_KEY"
    system_prompt_path: "segym/prompts/agent_neutral_system.txt"
    selector: "utility_minus_ethics"
    lambda_ethics: 1.0
    n: 4
    temperature: 0.7
    max_tokens: 800
    max_parse_retries: 1
opponent:
  type: "hybrid_threshold"
  stochastic: false
conditions:
  - "llm_best_of_n"
ethics_evaluator:
  deterministic: true
  llm_judge: false
output_dir: "runs/llm_best_of_n"
