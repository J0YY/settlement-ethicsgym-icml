experiment_name: "llm_stress_core_replication_claude_sonnet_seed901"
seed: 901
scenario_split: "data/splits/generated_stress_v0_2_48.txt"
max_rounds: 6
models:
  - id: "claude_sonnet_rep_seed901_best_of_n_utility_n8"
    type: "llm_best_of_n"
    provider: "anthropic"
    model_name_env: "SEGYM_CLAUDE_MODEL"
    model_name: "claude-sonnet-4-5"
    api_key_env: "ANTHROPIC_API_KEY"
    base_url: "https://api.anthropic.com/v1/messages"
    system_prompt_path: "segym/prompts/agent_stress_utility_system.txt"
    selector: "utility_only"
    n: 8
    temperature: 1.0
    max_tokens: 900
    max_parse_retries: 1
    max_request_retries: 4
  - id: "claude_sonnet_rep_seed901_best_of_n_ethics_n8"
    type: "llm_best_of_n"
    provider: "anthropic"
    model_name_env: "SEGYM_CLAUDE_MODEL"
    model_name: "claude-sonnet-4-5"
    api_key_env: "ANTHROPIC_API_KEY"
    base_url: "https://api.anthropic.com/v1/messages"
    system_prompt_path: "segym/prompts/agent_stress_utility_system.txt"
    selector: "utility_minus_ethics"
    lambda_ethics: 1.0
    n: 8
    temperature: 1.0
    max_tokens: 900
    max_parse_retries: 1
    max_request_retries: 4
  - id: "claude_sonnet_rep_seed901_shield_rewrite"
    type: "shielded"
    base_type: "llm"
    base_model_id: "claude_sonnet_rep_seed901_base_for_shield"
    provider: "anthropic"
    model_name_env: "SEGYM_CLAUDE_MODEL"
    model_name: "claude-sonnet-4-5"
    api_key_env: "ANTHROPIC_API_KEY"
    base_url: "https://api.anthropic.com/v1/messages"
    system_prompt_path: "segym/prompts/agent_stress_utility_system.txt"
    temperature: 1.0
    max_tokens: 900
    max_parse_retries: 1
    max_request_retries: 4
    shield_mode: "rewrite"
opponent:
  type: "hybrid_threshold"
  stochastic: false
conditions:
  - "stress_core_replication_claude_sonnet_seed901"
ethics_evaluator:
  deterministic: true
  llm_judge: false
output_dir: "runs/llm_stress_core_replication_claude_sonnet_seed901"
