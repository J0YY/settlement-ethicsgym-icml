experiment_name: "llm_utility_prompt"
seed: 104
scenario_split: "data/splits/mvp_test.txt"
max_rounds: 6
models:
  - id: "llm_utility_prompt"
    type: "llm"
    provider: "openai_compatible"
    model_name_env: "SEGYM_LLM_MODEL"
    model_name: "gpt-4.1-mini"
    api_key_env: "OPENAI_API_KEY"
    system_prompt_path: "segym/prompts/agent_utility_system.txt"
    temperature: 0.7
    max_tokens: 800
    max_parse_retries: 1
opponent:
  type: "hybrid_threshold"
  stochastic: false
conditions:
  - "utility_prompt"
ethics_evaluator:
  deterministic: true
  llm_judge: false
output_dir: "runs/llm_utility_prompt"
