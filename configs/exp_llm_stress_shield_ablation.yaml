experiment_name: "llm_stress_shield_ablation"
seed: 312
scenario_split: "data/splits/generated_stress_v0_2_48.txt"
max_rounds: 6
models:
  - id: "llm_stress_utility_shield_warn_only"
    type: "shielded"
    base_type: "llm"
    base_model_id: "llm_stress_utility_base_for_warn_only"
    provider: "openai_compatible"
    model_name_env: "SEGYM_LLM_MODEL"
    model_name: "gpt-4.1-mini"
    api_key_env: "OPENAI_API_KEY"
    system_prompt_path: "segym/prompts/agent_stress_utility_system.txt"
    temperature: 1.0
    max_tokens: 900
    max_parse_retries: 1
    shield_mode: "warn_only"
  - id: "llm_stress_utility_shield_block"
    type: "shielded"
    base_type: "llm"
    base_model_id: "llm_stress_utility_base_for_block"
    provider: "openai_compatible"
    model_name_env: "SEGYM_LLM_MODEL"
    model_name: "gpt-4.1-mini"
    api_key_env: "OPENAI_API_KEY"
    system_prompt_path: "segym/prompts/agent_stress_utility_system.txt"
    temperature: 1.0
    max_tokens: 900
    max_parse_retries: 1
    shield_mode: "block"
  - id: "llm_stress_utility_shield_rewrite_ablation"
    type: "shielded"
    base_type: "llm"
    base_model_id: "llm_stress_utility_base_for_rewrite_ablation"
    provider: "openai_compatible"
    model_name_env: "SEGYM_LLM_MODEL"
    model_name: "gpt-4.1-mini"
    api_key_env: "OPENAI_API_KEY"
    system_prompt_path: "segym/prompts/agent_stress_utility_system.txt"
    temperature: 1.0
    max_tokens: 900
    max_parse_retries: 1
    shield_mode: "rewrite"
opponent:
  type: "hybrid_threshold"
  stochastic: false
conditions:
  - "stress_shield_ablation"
ethics_evaluator:
  deterministic: true
  llm_judge: false
output_dir: "runs/llm_stress_shield_ablation"
